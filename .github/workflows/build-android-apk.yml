name: Build Android APK (MediaProjection + WebRTC)

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'android-native-template/**'
      - 'assets/**'
      - 'scripts/setup-android-screenshare.js'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & prepare web assets
        run: |
          npm install
          npm install @capacitor/android@^6.1.2 --no-save
          npm run prepare:www

      - name: Add & Sync Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android Screen Share & Audio Capture
        run: |
          node scripts/setup-android-screenshare.js

      - name: Build Debug APK (Installable directly on any Android)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/CineVerse-Lotte-Android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineVerse-Lotte-Android-APK
          path: output/CineVerse-Lotte-Android.apk
          retention-days: 30

      - name: Auto-commit APK to releases folder
        run: |
          FILE_SIZE=$(wc -c < output/CineVerse-Lotte-Android.apk)
          if [ "$FILE_SIZE" -lt 99614720 ]; then
            mkdir -p releases
            cp output/CineVerse-Lotte-Android.apk releases/CineVerse-Lotte-Android.apk
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add releases/CineVerse-Lotte-Android.apk
            if ! git diff --cached --quiet; then
              git commit -m "chore(release): update Android APK (${GITHUB_SHA::7}) [skip ci]"
              for i in 1 2 3 4; do
                git pull --rebase origin main && git push origin main && break
                sleep 3
              done
            fi
          else
            echo "APK exceeds 95MB ($FILE_SIZE bytes), skipping git commit and publishing to Release only."
          fi

      - name: Publish APK to GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CineVerse Lotte Latest Builds
          files: output/CineVerse-Lotte-Android.apk
          make_latest: true
